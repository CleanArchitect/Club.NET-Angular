<form [formGroup]="form">
    @for (column of form.columns; track $index) {
    <section>
        @for (row of column.rows; track $index) {
        <fieldset>
            <ng-template [cleanFormField]="{ model: form.model, field: field }" *ngFor="let field of row" />
        </fieldset>
        }
    </section>
    }
</form>
