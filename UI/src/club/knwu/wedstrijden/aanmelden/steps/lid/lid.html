<zxing-scanner class="scanner" [timeBetweenScans]="50" (scanSuccess)="scanSuccess($event)" *ngIf="scanEnabled" />

<mat-card [style.width.px]="375">
    <mat-card-content>
        <form [formGroup]="form">
            <mat-form-field appearance="outline">
                <mat-label>KNWU-ID</mat-label>

                <input matInput placeholder="Scan QR" formControlName="knwuId" (focus)="enableScan('knwuId')" (blur)="disableScan()" />

                <button mat-icon-button matSuffix (click)="enableScan('knwuId')"><mat-icon>qr_code_scanner</mat-icon></button>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>UCI-ID</mat-label>

                <input matInput placeholder="Scan QR" formControlName="uciId" (focus)="enableScan('uciId')" (blur)="disableScan()" />

                <button mat-icon-button matSuffix (click)="enableScan('uciId')"><mat-icon>qr_code_scanner</mat-icon></button>
            </mat-form-field>
        </form>

        <button mat-flat-button (click)="aanmelden()">
            <mat-icon>arrow_forward</mat-icon>
            <span>Aanmelden</span>
        </button>
    </mat-card-content>
</mat-card>
