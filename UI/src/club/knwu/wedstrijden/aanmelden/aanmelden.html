<mat-stepper class="stepper no-header" linear #stepper>
    <mat-step>
        <div class="step-start" [style.min-height.px]="300">
            <button class="btn-start" mat-flat-button (click)="stepper.next()">Aanmelden</button>
        </div>
    </mat-step>

    <mat-step>
        <button mat-icon-button (click)="stepper.previous()"><mat-icon>arrow_back</mat-icon></button>

        <knwu-wedstrijd-aanmelden-lid (knwuLid)="knwuLid = $event; stepper.next()" />
    </mat-step>

    <mat-step>
        <knwu-wedstrijd-aanmelden-wedstrijd [knwuLid]="knwuLid" (deelnemer)="deelnemer = $event; stepper.next()" />
    </mat-step>

    <mat-step>
        <knwu-wedstrijd-aanmelden-deelnemer [deelnemer]="deelnemer" />
    </mat-step>
</mat-stepper>
